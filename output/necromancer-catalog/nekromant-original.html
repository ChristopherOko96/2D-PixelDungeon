  <script type="application/json" id="necro-original-data">{"clips":[{"id":"minion_1","spec":"minion","name":"Knochenkrieger","text":"Beschwört deinen dauerhaften Knochenkrieger mit Schwert und Schild. Er sucht nahe Blutpfützen und saugt sie auf. Erst R verwandelt ihn ab 50 Blut; voller Balken allein löst keine Verwandlung aus. 5/6: Schildschlag/Knochenschrei, groß: Stampfen/Klingensturm.","stats":"Rang 3 · 25 Seelen · 30 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_1.png","posterFrame":30,"frames":122},{"id":"minion_3","spec":"minion","name":"Knochenspeer","text":"Knochenspeer durchschlägt 3 Gegner (110/130/150 %) und verlangsamt Getroffene kurz um 25 %.","stats":"Rang 3 · 10 Seelen · 5 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_3.png","posterFrame":15,"frames":92},{"id":"minion_5","spec":"minion","name":"Blutmal","text":"Markiert Gegner im Zielbereich für 8 s. Sterben sie, hinterlassen sie eine große echte Blutpfütze für deinen Knochenkrieger. Bosse und beschworene Gegner erzeugen keine Blutquelle.","stats":"Rang 3 · 14 Seelen · 10 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_5.png","posterFrame":30,"frames":182},{"id":"minion_7","spec":"minion","name":"Leichenexplosion","text":"Verbraucht die nächste eigene Leiche am Ziel: 100/120/140 % in 3 m und eine echte Blutpfütze. Ohne Leiche: halber Knochenausbruch ohne Blut.","stats":"Rang 3 · 24 Seelen · 12 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_7.png","posterFrame":30,"frames":92},{"id":"minion_9","spec":"minion","name":"Knochenschützen","text":"Beschwört zwei geriggte Knochenbogenschützen für 15 s. Beim Tod oder Ablauf explodieren ihre Knochen einmalig (60 % in 1,8 m). Höchstens zwei gleichzeitig.","stats":"Rang 1 · 28 Seelen · 24 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_9.png","posterFrame":30,"frames":122},{"id":"minion_11","spec":"minion","name":"Totenpakt","text":"Für 5 s übernimmt dein lebender Knochenkrieger 25/30/35 % deines Schadens. Überlauf bleibt bei dir; kein Teleport.","stats":"Rang 1 · 16 Seelen · 16 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_11.png","posterFrame":30,"frames":92},{"id":"minion_14","spec":"minion","name":"Knochenkoloss","text":"Verwandelt deinen lebenden Knochenkrieger ab 50 Blut in den großen Knochenkoloss. Der Blutbalken wird verbraucht: 50 Blut = 10 s, 100 Blut = 20 s. Danach wird er normal. Bogenschützen bleiben erhalten. 5: Stampfen, 6: Klingensturm.","stats":"Rang 1 · 40 Seelen · 60 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/minion_14.png","posterFrame":30,"frames":122},{"id":"curse_1","spec":"curse","name":"Knochenball","text":"Sammelt 0,65 s lang Knochen zu einer Kugel. Abschuss mit Knochenspur; zerplatzt am ersten Gegner oder an einer Wand. 100/115/130 % Schaden, Verfall und kleine Giftpfütze.","stats":"Rang 3 · 8 Seelen · 4 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_1.png","posterFrame":18,"frames":92},{"id":"curse_3","spec":"curse","name":"Fluch der Schwäche","text":"Drei eigenständige Fluchgeister umkreisen das verfluchte Ziel für 8/10/12 s. Es erleidet +10/15/20 % Schaden von dir.","stats":"Rang 3 · 12 Seelen · 14 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_3.png","posterFrame":30,"frames":122},{"id":"curse_5","spec":"curse","name":"Aderfessel","text":"Eine gezielte Blutader bis 7 m: 40/50/60 % Schaden, kurze Fessel und 20 % Schwächung. Bosse werden nur verlangsamt.","stats":"Rang 3 · 20 Seelen · 14 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_5.png","posterFrame":30,"frames":92},{"id":"curse_7","spec":"curse","name":"Seuchenfeld","text":"Echte Giftpfütze mit Giftnebel (3 m, 6 s) und magischem Verfall. Normale Gegner, die darin sterben, werden zu Skelettläufern: Sie jagen Gegner und explodieren beim Kontakt. Höchstens 6, jeweils bis zu 8 s; keine Weiterbeschwörung durch ihre Explosionen.","stats":"Rang 3 · 24 Seelen · 16 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_7.png","posterFrame":30,"frames":182},{"id":"curse_9","spec":"curse","name":"Blutstrahl","text":"Verbindet dich 3 s mit bis zu 4 Gegnern im Umkreis von 3/4/5 m und saugt Blut. Der gemeinsame Heilvorrat bleibt begrenzt. Tote an einer Verbindung senden einen Fluchgeist zum nächsten sichtbaren Gegner; keine endlose Kette.","stats":"Rang 1 · 24 Seelen · 12 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_9.png","posterFrame":30,"frames":122},{"id":"curse_11","spec":"curse","name":"Fluchernte","text":"Erntet eigene Flüche in 4 m und bis zu 3 eigene Giftpfützen: 60/80/100 % Schaden plus begrenzter Vorbereitungsbonus. Verbraucht die Vorbereitung statt zu teleportieren.","stats":"Rang 1 · 16 Seelen · 16 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_11.png","posterFrame":30,"frames":92},{"id":"curse_14","spec":"curse","name":"Seuchengrube","text":"Große echte Giftgrube (5 m, 8 s) mit Verfall und 25 % Schwächung. Der erste Gegner-Tod darin ruft einmal einen Fluchkoloss (12 s). Weitere Toten-Skelette platzen sofort. 5: Fluchwelle auf alle sichtbaren Gegner im Umkreis. 6: bis zu drei echte Leichen werden zu kleinen Fluchmonstern. Verbraucht bis zu 3 eigene Giftpfützen für mehr Schaden. ","stats":"Rang 1 · 40 Seelen · 60 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/curse_14.png","posterFrame":90,"frames":182},{"id":"soul_1","spec":"soul","name":"Seelenblitz","text":"Ein großer Seelenblitz: 120/140/160 % Schaden. Zerplatzt am ersten Gegner oder an einer Wand in Seelenpartikel.","stats":"Rang 3 · 8 Seelen · 4 s A rene Gegner werden nicht übernommen. 40 Seelen, 60 s Abklingzeit.","stats":"Rang 1 · 40 Seelen · 60 s Abklingzeit","extra":false,"variant":false,"common":false,"still":"original-stills/soul_14.png","posterFrame":30,"frames":182},{"id":"basic","spec":"soul","name":"Standardangriff · Stabgeschoss","text":"Kostenloser normaler Nekromantenangriff mit dem Stab.","stats":"Linke Maustaste · keine Seelenkosten","extra":false,"variant":false,"common":true,"still":"original-stills/basic.png","posterFrame":30,"frames":92},{"id":"defense","spec":"soul","name":"Knochenschild","text":"Shift halten: kreisende Knochen fangen ganze Treffer ab. Sie halten 2 Treffer, dann zerfallen sie für 8 s. Gesenkt kommt alle 3 s ein Treffer zurück.","stats":"Shift halten · 2 Treffer · 8 s bei Bruch","extra":false,"variant":false,"common":true,"still":"original-stills/defense.png","posterFrame":30,"frames":92},{"id":"bone_shout","spec":"minion","name":"Knochenschrei","text":"Zieht alle Gegner in 4,5 m für 5 s auf den Knochenkrieger.","stats":"Taste 6 · 15 s Abklingzeit","extra":true,"variant":false,"common":false,"still":"original-stills/bone_shout.png","posterFrame":30,"frames":92},{"id":"bone_stomp","spec":"minion","name":"Stampfen","text":"90 % Schaden in 3 m, normale Gegner 0,8 s betäubt.","stats":"Taste 5 · 7 s Abklingzeit","extra":true,"variant":false,"common":false,"still":"original-stills/bone_stomp.png","posterFrame":30,"frames":92},{"id":"bone_whirl","spec":"minion","name":"Klingensturm","text":"Der große Knochenkrieger entfesselt 2,4 s einen geriggten Klingensturm. Nach kurzem Ausholen treffen die Klingen alle 0,3 s in 2,8 m; Wände stoppen Treffer.","stats":"Taste 6 · 11 s Abklingzeit","extra":true,"variant":false,"common":false,"still":"original-stills/bone_whirl.png","posterFrame":30,"frames":92},{"id":"guardian_beam","spec":"soul","name":"Seelenstrahl","text":"Der Wächter bindet seinen geriggten Seelenstrahl an den ersten sichtbaren Gegner bis 8 m. Die Verbindung folgt ihm und hinterlässt Seelenmale. Tod, Wände oder zu große Entfernung lösen sie. 8 s Abklingzeit.","stats":"Taste 5 · 8 s Abklingzeit","extra":true,"variant":false,"common":false,"still":"original-stills/guardian_beam.png","posterFrame":28,"frames":122},{"id":"guardian_wave","spec":"soul","name":"Seelenwelle","text":"Der Wächter stößt seine Seelenwelle aus. Markiert und hält normale Gegner kurz fest. 4,8 s Abklingzeit.","stats":"Taste 6 · 4.8 s Abklingzeit","extra":true,"variant":false,"common":false,"still":"original-stills/guardian_wave.png","posterFrame":15,"frames":122},{"id":"archer_death","spec":"minion","name":"Knochenschützen · Leichenexplosion","text":"Tod oder Ablauf nach 15 Sekunden löst pro Bogenschütze genau eine Explosion aus. Die Aufnahme zeigt den kontrollierten Todesauslöser.","stats":"Automatischer Auslöser · 1,8 m · 60 % Begleiter-Grundschaden","extra":true,"variant":false,"common":false,"still":"original-stills/archer_death.png","posterFrame":30,"frames":92},{"id":"curse_death","spec":"curse","name":"Todesfluch · Weiterflug","text":"Ein am Blutstrahl gestorbener Gegner setzt einen eigenständigen Fluchgeist frei. Er verfolgt einen weiteren sichtbaren Gegner, verursacht Schaden und hinterlässt einen Fluch.","stats":"Automatischer Auslöser · bis 5 m · Wände stoppen den Flug","extra":true,"variant":false,"common":false,"still":"original-stills/curse_death.png","posterFrame":30,"frames":122},{"id":"shield_bash","spec":"minion","name":"Schildschlag","text":"60 % Schaden, betäubt normale Gegner 1 s.","stats":"Taste 5 · 9 s Abklingzeit","extra":true,"variant":false,"common":false,"still":"original-stills/shield_bash.png","posterFrame":30,"frames":92},{"id":"minion_14_stage_2","spec":"minion","name":"Knochenkoloss · Stufe 2 (Grabeskoloss)","text":"Verwandelt deinen lebenden Knochenkrieger ab 50 Blut in den großen Knochenkoloss. Der Blutbalken wird verbraucht: 50 Blut = 10 s, 100 Blut = 20 s. Danach wird er normal. Bogenschützen bleiben erhalten. 5: Stampfen, 6: Klingenst   <script>
  (()=>{
    const root=document.getElementById('necro-original-20261101'),data=JSON.parse(root.querySelector('#necro-original-data').textContent);
    const select=root.querySelector('select'),still=root.querySelector('#necro-original-still'),tabs=[...root.querySelectorAll('[data-spec]')];
    const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),play=root.querySelector('#necro-original-play'),slider=root.querySelector('input'),clock=root.querySelector('#necro-original-clock'),loading=root.querySelector('#necro-original-loading');
    ctx.imageSmoothingEnabled=false;
    let spec='soul',selected='soul_1',clip=null,frames=[],token=0,frame=0,playing=false,started=0,firstLoad=true;
    const snapshot=window.openai?.widgetState,state=snapshot?.modelContent||snapshot;
    if(data.specs.some(s=>s.id===state?.spec))spec=state.spec;
    if(data.clips.some(c=>c.id===state?.attack))selected=state.attack;
    if(location.hash==='#guardian_beam'){spec='soul';selected='guardian_beam';}
    if(location.hash==='#curse_brood'){spec='curse';selected='curse_brood';}
    const save=()=>{try{window.openai?.setWidgetState?.({modelContent:{spec,attack:selected},privateContent:null})?.catch(()=>{});}catch{}};
    function draw(){if(frames[frame])ctx.drawImage(frames[frame],0,0);slider.value=frame;clock.textContent=(frame/30).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' s / '+((clip?.frames||0)/30).toLocaleString('de-DE',{maximumFractionDigits:2})+' s';}
    function pause(){playing=false;play.textContent='Abspielen';}
    async function loadFrames(current){
      const generation=++token;pause();for(const image of frames)image.src='';frames=[];frame=0;canvas.hidden=true;still.hidden=false;play.disabled=true;slider.disabled=true;loading.textContent='Originalbilder laden …';let complete=0;
      const images=new Array(current.frames);let next=0;
      try{
        await Promise.all(Array.from({length:8},async()=>{while(next<images.length){const n=next++,image=new Image();image.src=data.frameRoot+current.id+'/frame-'+String(n).padStart(3,'0')+'.png';await image.decode();if(generation!==token)return;images[n]=image;complete++;loading.textContent=complete+' / '+images.length+' Originalbilder';}}));
        if(generation!==token)return;frames=images;frame=Math.min(current.posterFrame||30,images.length-1);slider.max=images.length-1;slider.disabled=false;play.disabled=false;loading.textContent='30 Bilder/s · '+images.length+' verlustfreie Originalbilder';still.hidden=true;canvas.hidden=false;draw();
        if(firstLoad&&['#play','#guardian_beam'].includes(location.hash)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){playing=true;started=performance.now()-frame/30*1000;play.textContent='Pause';}firstLoad=false;
      }catch(error){if(generation===token)loading.textContent='Aufnahme konnte nicht geladen werden: '+error.message;}
    }
    function show(id){clip=data.clips.find(c=>c.id===id);selected=id;select.value=id;root.querySelector('#necro-original-name').textContent=clip.name;root.querySelector('#necro-original-stats').textContent=clip.stats;root.querySelector('#necro-original-description').textContent=clip.text;still.src=clip.still;still.alt='Original-Spielbild: '+clip.name;if(data.frameRoot)loadFrames(clip);}
    function branch(value,keep){
      spec=value;tabs.forEach(t=>{const on=t.dataset.spec===spec;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on));});root.querySelector('#necro-original-panel').hidden=false;root.querySelector('#necro-original-panel').setAttribute('aria-labelledby','necro-original-'+spec);select.replaceChildren();
      for(const [label,test]of [['Aktive Fähigkeiten',c=>!c.extra&&!c.variant&&!c.common],['Ultimate-Aufwertungen',c=>c.variant&&c.id.includes('stage')],['Begleiter & Auslöser',c=>c.extra],['Weitere Angriffe',c=>c.variant&&!c.id.includes('stage')],['Grundangriff & Verteidigung',c=>c.common]]){
        const items=data.clips.filter(c=>(c.spec===spec||c.common)&&test(c));if(!items.length)continue;const group=document.createElement('optgroup');group.label=label;items.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;group.append(o);});select.append(group);
      }
      const passives=root.querySelector('#necro-original-passives');passives.replaceChildren();data.passives.filter(p=>p.spec===spec).forEach(p=>{const item=document.createElement('div'),name=document.createElement('strong'),text=document.createElement('p');name.textContent=p.name;text.textContent=p.text;item.append(name,text);passives.append(item);});
      show(keep&&[...select.options].some(o=>o.value===keep)?keep:data.clips.find(c=>c.spec===spec&&!c.extra&&!c.variant&&!c.common).id);
    }
    tabs.forEach(t=>t.addEventListener('click',()=>{branch(t.dataset.spec);save();}));select.addEventListener('change',()=>{show(select.value);save();});
    play.addEventListener('click',()=>{if(playing)pause();else if(frames.length){playing=true;started=performance.now()-frame/30*1000;play.textContent='Pause';}});
    for(const [id,delta]of [['prev',-1],['next',1]])root.querySelector('#necro-original-'+id).addEventListener('click',()=>{pause();if(!frames.length)return;frame=(frame+delta+frames.length)%frames.length;draw();});
    slider.addEventListener('input',()=>{pause();frame=Number(slider.value);draw();});
    root.querySelector('#necro-original-fullscreen').addEventListener('click',()=>{canvas.requestFullscreen?.().catch(()=>{});});
    function tick(now){if(playing&&frames.length){const n=Math.floor((now-started)*30/1000)%frames.length;if(n!==frame){frame=n;draw();}}requestAnimationFrame(tick);}
    if(data.frameRoot){still.hidden=true;root.querySelector('#necro-original-player').hidden=false;root.querySelector('#necro-original-note').textContent='640 × 360 Originalpixel · 30 Bilder/s · verlustfreie PNG-Einzelbilder';requestAnimationFrame(tick);}
    window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState,v=s?.modelContent||s;if(data.specs.some(s=>s.id===v?.spec))branch(v.spec,v.attack);});
    branch(spec,selected);
  })();
  </script>
